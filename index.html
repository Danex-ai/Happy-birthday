<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>My Special Gift</title>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-three.prod.js"></script>

  <!-- 3D TEXT -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/geometries/TextGeometry.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: radial-gradient(circle, #120018, #000); }
    #overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #ffb6d9; font-family: Arial; font-size: 18px;
      text-align: center;
    }
  </style>
</head>

<body>
<div id="overlay">😊 Smile my love... your surprise is ready 💖</div>

<script>
const start = async () => {

  const mindarThree = new window.MINDAR.FACE.MindARThree({
    container: document.body
  });

  const {renderer, scene, camera} = mindarThree;
  renderer.setPixelRatio(window.devicePixelRatio);

  const light = new THREE.HemisphereLight(0xffffff, 0xff66cc, 1.2);
  scene.add(light);

  const anchor = mindarThree.addAnchor(1);

  // 🎬 cinematic + slow motion
  let zoomActive = false;
  let zoomProgress = 0;
  let slowMotion = false;
  let speed = 1;

  function startCinematicZoom(){
    zoomActive = true;
    zoomProgress = 0;
  }

  // 🌟 ambience
  const ambience = new THREE.Group();
  for(let i=0;i<80;i++){
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.02),
      new THREE.MeshStandardMaterial({ color: 0xff66cc, emissive: 0x220011 })
    );
    p.position.set((Math.random()-0.5)*2, Math.random()*2, (Math.random()-0.5)*2);
    ambience.add(p);
  }
  ambience.visible=false;
  anchor.group.add(ambience);

  // 💖 hearts
  const hearts = new THREE.Group();
  for(let i=0;i<60;i++){
    const h = new THREE.Mesh(
      new THREE.SphereGeometry(0.03),
      new THREE.MeshStandardMaterial({ color: 0xff2d95, emissive: 0x330011 })
    );
    h.position.set((Math.random()-0.5)*2, Math.random()*2, (Math.random()-0.5)*2);
    hearts.add(h);
  }
  hearts.visible=false;
  anchor.group.add(hearts);

  // 🖼️ slideshow
  const loader = new THREE.TextureLoader();
  const imgs = [
    'image1.jpg',
    'image2.jpg',
    'image3.jpg',
    'image4.jpg',
    'image5.jpg',
    'image6.jpg',
    'image7.jpg',
    'image8.jpg',
    'image9.jpg',
    'image10.jpg'
  ];
  const textures = imgs.map(u=>loader.load(u));

  function polaroid(tex){
    const g = new THREE.Group();

    const frame = new THREE.Mesh(
      new THREE.PlaneGeometry(1.2,1.5),
      new THREE.MeshStandardMaterial({color:0xffffff})
    );

    const photo = new THREE.Mesh(
      new THREE.PlaneGeometry(0.95,1.05),
      new THREE.MeshBasicMaterial({map:tex})
    );

    photo.position.z=0.01;
    photo.position.y=0.12;

    g.add(frame);
    g.add(photo);
    g.rotation.z=(Math.random()-0.5)*0.08;

    return g;
  }

  const p1 = polaroid(textures[0]);
  const p2 = polaroid(textures[1]);
  p1.visible=false;
  p2.visible=false;

  anchor.group.add(p1);
  anchor.group.add(p2);

  // 💬 typing text
  const msg = `✨ HAPPY BIRTHDAY OLUWATOSIN, MY LOVE ✨

If you’re seeing this, just pause for a moment… this message is a prayer from my heart to you ❤️

Heavenly Father,
I thank You for the life of Oluwatosin, for bringing someone so beautiful, kind, and precious into my world. On this special day, I commit her into Your loving hands.

Lord, please bless Oluwatosin abundantly. Let this new year of her life be filled with peace that surpasses understanding, joy that never runs dry, and love that surrounds her everywhere she goes.

Guide her steps in everything she does. Open doors of success, favor, and opportunities that no one can shut. Protect her from harm, from sadness, and from anything that may try to dim her light.

Let her dreams come alive, one by one. Give her strength in difficult moments, wisdom in her decisions, and a heart that will always find reasons to smile.

Father, keep Oluwatosin safe, uplift her spirit, and let her life be a testimony of Your goodness. May she continue to shine brighter every single day.

And as these words appear around her, let her feel deeply loved—not just by me, but by You always.

💖 Happy Birthday, Oluwatosin 💖
🎉 You are blessed beyond measure 🎉
🙏 I love you always 🙏`;

  const c=document.createElement('canvas');
  c.width=512;c.height=256;
  const cx=c.getContext('2d');
  const tx=new THREE.CanvasTexture(c);

  const text=new THREE.Mesh(
    new THREE.PlaneGeometry(1.5,0.7),
    new THREE.MeshBasicMaterial({map:tx,transparent:true})
  );

  text.position.set(0,1.3,0);
  text.visible=false;
  anchor.group.add(text);

  function draw(s){
    cx.clearRect(0,0,512,256);
    cx.fillStyle="#000";
    cx.fillRect(0,0,512,256);
    cx.fillStyle="#ff69b4";
    cx.font="bold 38px Arial";
    cx.textAlign="center";
    cx.fillText(s,256,140);
    tx.needsUpdate=true;
  }

  // 💫 3D TEXT (UPDATED)
  let floatingText;

  const fontLoader = new THREE.FontLoader();
  fontLoader.load(
    'https://cdn.jsdelivr.net/npm/three@0.152.2/examples/fonts/helvetiker_bold.typeface.json',
    (font) => {

      const geometry = new THREE.TextGeometry("HAPPY BIRTHDAY OLUWATOSIN", {
        font: font,
        size: 0.25,
        height: 0.08,
        bevelEnabled: true,
        bevelThickness: 0.02,
        bevelSize: 0.02
      });

      // ✅ CENTER TEXT
      geometry.computeBoundingBox();
      const centerOffset =
        -0.5 * (geometry.boundingBox.max.x - geometry.boundingBox.min.x);
      geometry.translate(centerOffset, 0, 0);

      const material = new THREE.MeshStandardMaterial({
        color: 0xff4da6,
        emissive: 0x330011
      });

      floatingText = new THREE.Mesh(geometry, material);
      floatingText.position.set(0, 2.2, -1);
      floatingText.visible = false;

      anchor.group.add(floatingText);
    }
  );

  // 🎆 fireworks
  const fire=new THREE.Group();
  let parts=[];

  function boom(){
    for(let i=0;i<140;i++){
      const m=new THREE.Mesh(
        new THREE.SphereGeometry(0.02),
        new THREE.MeshStandardMaterial({
          color:Math.random()*0xffffff,
          emissive:0x220011
        })
      );

      m.position.set(0,1,0);
      m.vel=new THREE.Vector3(
        (Math.random()-0.5)*0.12,
        Math.random()*0.12,
        (Math.random()-0.5)*0.12
      );

      fire.add(m);
      parts.push(m);
    }
    anchor.group.add(fire);
  }

  const audio=new Audio('audio.mp3');

  await mindarThree.start();

  let started=false;
  let idx=0,nxt=1,t=0,last=Date.now();
  let done=false,i=0,lastT=Date.now();

  renderer.setAnimationLoop(()=>{

    const f=mindarThree.getLatestFaceData();

    if(f&&f.blendshapes){
      const s=f.blendshapes.find(b=>b.categoryName==='mouthSmileLeft');

      if(s&&s.score>0.5&&!started){
        started=true;

        document.getElementById('overlay').style.display='none';

        hearts.visible=true;
        ambience.visible=true;
        p1.visible=true;
        p2.visible=true;
        text.visible=true;

        if(floatingText) floatingText.visible=true;

        audio.play();

        startCinematicZoom();
        slowMotion=true;
      }
    }

    if(started){

      speed = slowMotion ? 0.25 : 1;

      // 🎬 zoom
      if(zoomActive){
        zoomProgress += 0.02 * speed;
        const ease = Math.min(1, zoomProgress);

        camera.fov = 50 - (ease * 15);
        camera.updateProjectionMatrix();

        camera.position.z = 0.8 - (ease * 0.15);

        if(ease>=1){
          slowMotion=false;
        }
      }

      // 💖 hearts
      hearts.children.forEach(h=>{
        h.position.y += 0.01 * speed;
        if(h.position.y>2)h.position.y=-1;
      });

      // 🌟 ambience
      ambience.children.forEach(a=>{
        a.position.y += 0.005 * speed;
      });

      // 🖼️ slideshow
      if(Date.now()-last > (3000 / speed)){
        nxt=(idx+1)%textures.length;
        p2.children[1].material.map=textures[nxt];
        p2.children[1].material.needsUpdate=true;
        t=0;
        last=Date.now();
      }

      if(t<1){
        t += 0.02 * speed;
        p1.scale.set(1+t*0.05,1+t*0.05,1);
        p2.scale.set(1+t*0.05,1+t*0.05,1);

        if(t>=1){
          idx=nxt;
          if(idx===textures.length-1 && !done){
            done=true;
            boom();
          }
        }
      }

      // 💫 3D text animation
      if(floatingText){
        floatingText.position.y = 2.2 + Math.sin(Date.now()*0.002)*0.15;
        floatingText.rotation.y += 0.01 * speed;
        floatingText.rotation.x = Math.sin(Date.now()*0.001)*0.1;
      }

      // 💬 typing
      if(i<msg.length && Date.now()-lastT > (70 / speed)){
        i++;
        draw(msg.substring(0,i));
        lastT=Date.now();
      }

      text.position.y = 1.3 + Math.sin(Date.now()*0.002)*0.05;

      // 🎆 fireworks
      parts.forEach(p=>{
        p.position.add(p.vel.clone().multiplyScalar(speed));
        p.vel.y -= 0.0012 * speed;
      });
    }

    renderer.render(scene,camera);
  });
};

start();
</script>
</body>
</html>
